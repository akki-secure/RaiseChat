name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

jobs:
  server:
    name: Server (lint / typecheck / test / build)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: raisechat_test
          POSTGRES_USER: raisechat_admin
          POSTGRES_PASSWORD: adminpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: apps/server

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: raisechat_test
      DB_USER: raisechat_app
      DB_PASSWORD: testpassword
      JWT_SECRET: ci-test-secret-do-not-use-in-prod
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm build

      - name: Create app role and run migrations (admin)
        run: |
          export PGPASSWORD=adminpassword
          psql -h localhost -U raisechat_admin -d raisechat_test \
            -v ON_ERROR_STOP=1 -v app_password=testpassword -f src/db/roles/app_role.sql
          for f in $(ls src/db/migrations/*.sql | sort); do
            echo "apply $f"
            psql -h localhost -U raisechat_admin -d raisechat_test \
              -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Verify app role is least-privilege
        run: |
          export PGPASSWORD=testpassword
          q() { psql -h localhost -U raisechat_app -d raisechat_test -tA -c "$1"; }
          q "SELECT count(*) FROM users" >/dev/null
          [ "$(q "SELECT rolsuper FROM pg_roles WHERE rolname = current_user")" = "f" ]
          if q "DELETE FROM users" 2>/dev/null; then echo "DELETE が許可されています"; exit 1; fi
          if q "TRUNCATE users" 2>/dev/null; then echo "TRUNCATE が許可されています"; exit 1; fi
          if q "DROP TABLE users" 2>/dev/null; then echo "DROP が許可されています"; exit 1; fi
          if q "CREATE TABLE ci_probe (i int)" 2>/dev/null; then echo "CREATE が許可されています"; exit 1; fi

      - name: Test
        run: pnpm test

  web:
    name: Web (lint / typecheck / test / build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    env:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_WS_URL: http://localhost:4000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 履歴全体をスキャンするため

      - name: Install gitleaks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in 1 2 3 4 5; do
            gh release download v8.30.1 --repo gitleaks/gitleaks \
              --pattern 'gitleaks_8.30.1_linux_x64.tar.gz' --dir "$RUNNER_TEMP" --clobber && break
            echo "ダウンロードに失敗しました（${i}回目）"
            [ "$i" = 5 ] && exit 1
            sleep $((i * 5))
          done
          tar -xz -C /usr/local/bin -f "$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz" gitleaks

      - name: Scan history
        run: gitleaks detect --source . --config .gitleaks.toml --redact
