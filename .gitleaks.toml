[extend]
  useDefault = true   # gitleaks 標準ルール（AWSキー・GitHubトークン・秘密鍵など）を有効化

[allowlist]
  description = "追跡されない物・.env.example・テスト用ダミー値"
  paths = [
    '''(^|/)\.env$''',            # 本物のシークレットを置く場所（gitignore済み）
    '''(^|/)\.env\.example$''',   # 値は空のひな形
    '''(^|/)dist/''',            # ビルド生成物（server）
    '''(^|/)\.next/''',          # ビルド生成物（Next.js。標準ルールの generic-api-key が誤検出するため）
    '''(^|/)node_modules/''',    # 依存パッケージ
  ]
  regexes = [
    '''=\s*['"]test-[\w-]+['"]''',  # テスト用ダミー値は test- で始まる値のみ許可
  ]

[[rules]]
  id = "jwt-secret"
  description = "JWT Secret"
  regex = '''JWT_SECRET\s*=\s*[^\$\{][^\s]{8,}'''
  severity = "CRITICAL"

[[rules]]
  id = "db-password"
  description = "Database password"
  regex = '''DB_PASSWORD\s*=\s*[^\$\{][^\s]{4,}'''
  severity = "CRITICAL"

[[rules]]
  id = "aws-secret"
  description = "AWS Secret Access Key"
  regex = '''AWS_SECRET_ACCESS_KEY\s*=\s*[^\$\{][^\s]{8,}'''
  severity = "CRITICAL"
